name: colony_app
description: "Colony — Hyper-local social media app for India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1
  web_socket_channel: ^2.4.0

  # Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # Location & Maps
  geolocator: ^13.0.2
  permission_handler: ^11.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  liquid_pull_to_refresh: ^3.0.1
  flutter_staggered_animations: ^1.1.1
  confetti: ^0.7.0
  fl_chart: ^0.70.2

  # Media
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.1.2
  video_player: ^2.9.5
  camera: ^0.11.1

  # Auth & Security
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Notifications
  flutter_local_notifications: ^18.0.1
  firebase_messaging: ^15.2.4
  firebase_core: ^3.12.1

  # Utils
  intl: ^0.20.2
  timeago: ^3.7.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.2.1
  device_info_plus: ^11.3.3
  connectivity_plus: ^6.1.3
  battery_plus: ^6.2.1
  wakelock_plus: ^1.2.10
  vibration: ^3.1.8

  # Reactive & Data
  rxdart: ^0.28.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
