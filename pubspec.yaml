name: colony_app
description: "Colony — Hyper-local social media app for India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.2.3

  # Networking
  dio: ^5.4.0
  socket_io_client: ^3.1.4
  web_socket_channel: ^3.0.3

  # Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^10.2.0
  path_provider: ^2.1.2

  # Location & Maps
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.0

  # UI & Design
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  liquid_pull_to_refresh: ^3.0.1
  flutter_staggered_animations: ^1.1.1
  confetti: ^0.8.0
  fl_chart: ^1.2.0

  # Media
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.1.2
  video_player: ^2.9.5
  camera: ^0.12.0+1

  # Auth & Security
  local_auth: ^3.0.1
  crypto: ^3.0.6

  # Notifications
  flutter_local_notifications: ^21.0.0
  firebase_messaging: ^16.2.2
  firebase_core: ^4.9.0

  # Utils
  intl: ^0.20.2
  timeago: ^3.7.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.1.1
  battery_plus: ^7.0.0
  wakelock_plus: ^1.2.10
  vibration: ^3.1.8

  # Reactive & Data
  rxdart: ^0.28.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
